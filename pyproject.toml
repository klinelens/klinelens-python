[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klinelens"
version = "0.1.0"
description = "Python client for the K-Line Lens API: Bitcoin order flow, liquidations, large trades, the order book and derivatives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "K-Line Lens", email = "support@klinelens.com" }]
keywords = ["bitcoin", "order flow", "liquidations", "cvd", "crypto", "market data", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://klinelens.com"
Documentation = "https://klinelens.com/api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klinelens = ["py.typed"]
